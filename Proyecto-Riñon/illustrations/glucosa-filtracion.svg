<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,sans-serif;fill:#463a35}.title{font-size:36px;font-weight:700}.sub{font-size:20px;fill:#83776f}.label{font-size:24px;font-weight:600}.small{font-size:19px}.line{fill:none;stroke:#a69083;stroke-width:2}.card{fill:#fff;stroke:#e2d6cc;stroke-width:2}</style><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a43b3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b8790"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c08030"/></marker></defs><rect width="1200" height="760" fill="#f9f7f4"/><title id="title">Filtración y reabsorción de glucosa</title><desc id="desc">El mismo balance de glucosa que usa el módulo de Filtración.</desc><text x="55" y="68" class="title">Filtración y reabsorción de glucosa</text><text x="55" y="104" class="sub">El mismo balance de glucosa que usa el módulo de Filtración.</text><rect x="55" y="165" width="320" height="120" rx="16" fill="#f8e4e1" stroke="#e2d6cc" stroke-width="2"/><text x="73" y="205" class="label">Glucosa en la sangre</text><text x="75" y="239" class="small">Glucemia y TFG</text><rect x="463" y="165" width="307" height="120" rx="16" fill="#e5f1ee" stroke="#e2d6cc" stroke-width="2"/><text x="481" y="205" class="label">Carga filtrada</text><text x="483" y="239" class="small">F = TFG × glucemia / 100</text><path d="M375 220 L454 220" fill="none" stroke="#2b8790" stroke-width="5" stroke-linecap="round" marker-end="url(#blue)"/><rect x="463" y="363" width="307" height="115" rx="16" fill="#fff0db" stroke="#e2d6cc" stroke-width="2"/><text x="481" y="403" class="label">Túbulo proximal</text><text x="483" y="437" class="small" style="font-size:17px">Capacidad de transporte: TmG</text><path d="M614 285 L614 354" fill="none" stroke="#2b8790" stroke-width="5" stroke-linecap="round" marker-end="url(#blue)"/><rect x="55" y="537" width="427" height="105" rx="16" fill="#f8e4e1" stroke="#e2d6cc" stroke-width="2"/><text x="73" y="577" class="label">Reabsorción hacia la sangre</text><text x="75" y="609" class="small">R = min(F, TmG)</text><rect x="690" y="537" width="455" height="105" rx="16" fill="#e5f1ee" stroke="#e2d6cc" stroke-width="2"/><text x="708" y="577" class="label">Glucosa que continúa por el túbulo</text><text x="710" y="609" class="small">E = max(0, F − R)</text><path d="M523 478 L523 502 L268 502 L268 529" fill="none" stroke="#c08030" stroke-width="5" stroke-linecap="round" marker-end="url(#orange)"/><path d="M710 478 L710 502 L920 502 L920 529" fill="none" stroke="#2b8790" stroke-width="5" stroke-linecap="round" marker-end="url(#blue)"/><text x="862" y="203" class="label">Si F ≤ TmG:</text><text x="862" y="237" class="small">se reabsorbe toda la glucosa</text><text x="862" y="267" class="small">en este modelo idealizado.</text><text x="862" y="363" class="label">Si F &gt; TmG:</text><text x="862" y="397" class="small">la capacidad se supera y</text><text x="862" y="427" class="small">parte continúa hacia la orina.</text><text x="55" y="681" class="small">Unidades: TFG en mL/min; glucemia en mg/dL; F, R, E y TmG en mg/min.</text><text x="55" y="725" class="small">ATLAS RENAL · Esquema educativo, sin escala anatómica.</text></svg>